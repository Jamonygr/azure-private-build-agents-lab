<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc"><title id="title">Private infrastructure, explicit ownership</title><desc id="desc">An operator manages the foundation through Azure. An existing private Windows host validates private endpoints from outside the exclusively delegated pool subnet. The VNet contains a managed Windows pool, Firewall DNS proxy and private Blob and Key Vault endpoints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#94a3b8}.bt{font-size:21px;font-weight:650}.line{font-size:17px}.label{font-size:16px;fill:#7dd3fc}.small{font-size:15px;fill:#94a3b8}.edge{fill:none;stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}</style><rect width="1280" height="850" fill="#07111f"/><rect x="0" y="0" width="1280" height="8" fill="#0ea5e9"/><text x="50" y="65" class="title">Private infrastructure, explicit ownership</text><text x="50" y="100" class="sub">AZURE PRIVATE BUILD AGENTS LAB  /  OPERATOR-DRIVEN EDITION</text><rect x="50" y="135" width="350" height="140" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="171" class="bt">Operator workstation</text><text x="72" y="207" class="line">Foundation management plane</text><text x="72" y="234" class="line">Local state and reviewed plans</text><rect x="820" y="135" width="410" height="140" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="842" y="171" class="bt">Existing private Windows host</text><text x="842" y="207" class="line">Operator-supplied route and DNS</text><text x="842" y="234" class="line">No validation VM is deployed</text><rect x="50" y="340" width="1180" height="360" rx="16" fill="#0a1c2e" stroke="#0ea5e9" stroke-width="2"/><text x="75" y="377" class="bt">LAB VNET  ·  10.60.0.0/16</text><rect x="80" y="410" width="315" height="200" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="102" y="446" class="bt">Managed DevOps Pool</text><text x="102" y="482" class="line">Windows 2025 Gen2</text><text x="102" y="509" class="line">Standard_D2ads_v5</text><text x="102" y="536" class="line">Max 1 / standby 0</text><text x="102" y="563" class="line">Exclusive delegated subnet</text><rect x="445" y="410" width="300" height="200" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="467" y="446" class="bt">Azure Firewall Standard</text><text x="467" y="482" class="line">Controlled outbound</text><text x="467" y="509" class="line">DNS proxy</text><text x="467" y="536" class="line">Dedicated Firewall subnet</text><rect x="795" y="410" width="405" height="200" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="817" y="446" class="bt">Private services</text><text x="817" y="482" class="line">Blob workload state + Key Vault</text><text x="817" y="509" class="line">Separate endpoint subnet</text><text x="817" y="536" class="line">Linked private DNS zones</text><text x="817" y="563" class="line">Public access disabled</text><path d="M225 275 V328" class="edge"/><text x="245" y="312" class="label">Creates foundation</text><path d="M1025 275 V398" class="edge"/><text x="1040" y="312" class="label">Private path required</text><path d="M395 500 H434" class="edge"/><path d="M235 610 V632 H995 V612" class="edge"/><text x="445" y="628" class="small">Private endpoint data uses VNet routing</text><text x="83" y="660" class="small">Pool job execution is outside v1.</text><text x="448" y="660" class="small">Explicit destination allowlist.</text><text x="798" y="660" class="small">Synthetic secret value stays out of Terraform.</text><rect x="50" y="725" width="1180" height="65" rx="12" fill="#122238" stroke="#36566e" stroke-width="1.5"/><text x="72" y="761" class="bt">External prerequisites: Azure DevOps project, pool admin rights, existing host connectivity</text><text x="50" y="825" class="small">The existing host must not be placed in the pool subnet. Host tests do not establish actual agent-job behavior.</text></svg>