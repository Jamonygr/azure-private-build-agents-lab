<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">Follow the name, then follow the packet</title><desc id="desc">DNS queries go through the Firewall proxy to Azure private DNS and return private endpoint addresses. A separately qualified existing host can test allowed and blocked outbound traffic only if its route uses the lab Firewall.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#94a3b8}.bt{font-size:21px;font-weight:650}.line{font-size:17px}.label{font-size:16px;fill:#7dd3fc}.small{font-size:15px;fill:#94a3b8}.edge{fill:none;stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}</style><rect width="1280" height="880" fill="#07111f"/><rect x="0" y="0" width="1280" height="8" fill="#0ea5e9"/><text x="50" y="65" class="title">Follow the name, then follow the packet</text><text x="50" y="100" class="sub">AZURE PRIVATE BUILD AGENTS LAB  /  OPERATOR-DRIVEN EDITION</text><rect x="50" y="160" width="250" height="150" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="196" class="bt">Private host</text><text x="72" y="232" class="line">Normal Blob / vault name</text><text x="72" y="259" class="line">Approved DNS path</text><rect x="370" y="160" width="250" height="150" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="392" y="196" class="bt">Firewall DNS proxy</text><text x="392" y="232" class="line">Consistent resolver path</text><text x="392" y="259" class="line">In lab VNet</text><rect x="690" y="160" width="270" height="150" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="712" y="196" class="bt">Linked private zones</text><text x="712" y="232" class="line">Blob + Key Vault zones</text><text x="712" y="259" class="line">Private A records</text><rect x="1030" y="160" width="200" height="150" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="1052" y="196" class="bt">Private IP</text><text x="1052" y="232" class="line">Endpoint address</text><text x="1052" y="259" class="line">Then TLS / RBAC</text><path d="M300 235 H359" class="edge"/><text x="310" y="218" class="label">query</text><path d="M620 235 H679" class="edge"/><text x="628" y="218" class="label">resolve</text><path d="M960 235 H1019" class="edge"/><text x="962" y="218" class="label">answer</text><text x="50" y="360" class="sub">A correct A record proves name resolution. Routing, TLS and authorization still need separate checks.</text><rect x="50" y="520" width="300" height="160" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="556" class="bt">Qualified egress tester</text><text x="72" y="592" class="line">Record actual source IP</text><text x="72" y="619" class="line">Prove UDR / next hop</text><text x="72" y="646" class="line">Outside pool subnet</text><rect x="440" y="520" width="300" height="160" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="462" y="556" class="bt">Lab Firewall policy</text><text x="462" y="592" class="line">Explicit approved targets</text><text x="462" y="619" class="line">Default unmatched deny</text><text x="462" y="646" class="line">Diagnostic logs</text><rect x="870" y="440" width="360" height="130" rx="12" fill="#173e37" stroke="#36566e" stroke-width="1.5"/><text x="892" y="476" class="bt">Allowed destination</text><text x="892" y="512" class="line">Probe succeeds + allow evidence</text><rect x="870" y="650" width="360" height="130" rx="12" fill="#422734" stroke="#36566e" stroke-width="1.5"/><text x="892" y="686" class="bt">Excluded destination</text><text x="892" y="722" class="line">Probe denied + matching log</text><path d="M350 600 H429" class="edge"/><text x="369" y="581" class="label">test</text><path d="M740 570 H795 V505 H859" class="edge"/><text x="794" y="480" class="label">allow</text><path d="M740 635 H795 V715 H859" class="edge"/><text x="799" y="744" class="label">deny</text><text x="50" y="840" class="small">If the tester bypasses this Firewall, mark Firewall enforcement NOT VERIFIED. No actual pool job is run.</text></svg>