<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Identity is separate from connectivity</title><desc id="desc">The configured operator has scoped Blob data, Key Vault read, and sample group Contributor roles. Temporary secret writing is removed after seed. The pool identity and DevOps infrastructure service principal have separate responsibilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#94a3b8}.bt{font-size:21px;font-weight:650}.line{font-size:17px}.label{font-size:16px;fill:#7dd3fc}.small{font-size:15px;fill:#94a3b8}.edge{fill:none;stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}</style><rect width="1280" height="820" fill="#07111f"/><rect x="0" y="0" width="1280" height="8" fill="#0ea5e9"/><text x="50" y="65" class="title">Identity is separate from connectivity</text><text x="50" y="100" class="sub">AZURE PRIVATE BUILD AGENTS LAB  /  OPERATOR-DRIVEN EDITION</text><rect x="50" y="165" width="300" height="165" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="201" class="bt">Configured operator</text><text x="72" y="237" class="line">Azure CLI sign-in</text><text x="72" y="264" class="line">Explicit tenant / subscription</text><text x="72" y="291" class="line">Existing private host</text><rect x="440" y="140" width="355" height="285" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="462" y="176" class="bt">Scoped operator access</text><text x="462" y="212" class="line">Blob Data Contributor</text><text x="462" y="239" class="line">  on state container</text><text x="462" y="266" class="line">Key Vault Secrets User</text><text x="462" y="293" class="line">  on lab vault</text><text x="462" y="320" class="line">Contributor</text><text x="462" y="347" class="line">  on precreated sample group</text><rect x="875" y="165" width="355" height="220" rx="12" fill="#392b20" stroke="#36566e" stroke-width="1.5"/><text x="897" y="201" class="bt">Temporary seed write</text><text x="897" y="237" class="line">Secrets Officer only for seed</text><text x="897" y="264" class="line">enable_secret_seed = true</text><text x="897" y="291" class="line">Then remove grant</text><text x="897" y="318" class="line">Prove read works / write denied</text><path d="M350 245 H429" class="edge"/><path d="M795 245 H864" class="edge"/><rect x="50" y="505" width="355" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="541" class="bt">Pool managed identity</text><text x="72" y="577" class="line">Attached to pool</text><text x="72" y="604" class="line">No workload data roles</text><text x="72" y="631" class="line">No operator privilege implied</text><rect x="455" y="505" width="355" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="477" y="541" class="bt">Service principal</text><text x="477" y="577" class="line">DevOps infrastructure service</text><text x="477" y="604" class="line">Required delegated-network</text><text x="477" y="631" class="line">permissions only</text><rect x="860" y="505" width="370" height="170" rx="12" fill="#30213b" stroke="#36566e" stroke-width="1.5"/><text x="882" y="541" class="bt">Existing inherited roles</text><text x="882" y="577" class="line">Inspect effective permissions</text><text x="882" y="604" class="line">Broad inherited rights can</text><text x="882" y="631" class="line">invalidate a negative test</text><text x="50" y="765" class="small">Network access does not grant data access. A management-plane role does not automatically grant Blob or secret rights.</text></svg>