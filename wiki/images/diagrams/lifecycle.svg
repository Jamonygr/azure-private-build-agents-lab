<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Two states, one safe teardown order</title><desc id="desc">The operator first creates the foundation with local state, then validates private services and deploys a sample using private Blob state. Cleanup destroys and verifies the workload before deleting the foundation and checking residuals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#94a3b8}.bt{font-size:21px;font-weight:650}.line{font-size:17px}.label{font-size:16px;fill:#7dd3fc}.small{font-size:15px;fill:#94a3b8}.edge{fill:none;stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}</style><rect width="1280" height="800" fill="#07111f"/><rect x="0" y="0" width="1280" height="8" fill="#0ea5e9"/><text x="50" y="65" class="title">Two states, one safe teardown order</text><text x="50" y="100" class="sub">AZURE PRIVATE BUILD AGENTS LAB  /  OPERATOR-DRIVEN EDITION</text><rect x="50" y="170" width="260" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="206" class="bt">1  Foundation</text><text x="72" y="242" class="line">Local state</text><text x="72" y="269" class="line">Network / pool / endpoints</text><text x="72" y="296" class="line">Precreated sample group</text><rect x="360" y="170" width="260" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="382" y="206" class="bt">2  Private checks</text><text x="382" y="242" class="line">Existing host + operator</text><text x="382" y="269" class="line">DNS / access / seed</text><text x="382" y="296" class="line">Revoke temporary write</text><rect x="670" y="170" width="260" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="692" y="206" class="bt">3  Workload</text><text x="692" y="242" class="line">Private Blob state</text><text x="692" y="269" class="line">Plan / apply / no-op</text><text x="692" y="296" class="line">Owned sample resources</text><rect x="980" y="170" width="250" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="1002" y="206" class="bt">4  Recovery drills</text><text x="1002" y="242" class="line">DNS / RBAC restoration</text><text x="1002" y="269" class="line">Known lease conflict</text><text x="1002" y="296" class="line">Release and reverify</text><path d="M310 255 H349" class="edge"/><path d="M620 255 H659" class="edge"/><path d="M930 255 H969" class="edge"/><path d="M1105 340 V410 H180 V480" class="edge"/><text x="480" y="397" class="label">KEEP THE PRIVATE BACKEND AVAILABLE UNTIL WORKLOAD DELETION</text><rect x="50" y="490" width="350" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="72" y="526" class="bt">5  Workload destroy</text><text x="72" y="562" class="line">Run on existing private host</text><text x="72" y="589" class="line">Empty state + empty group</text><text x="72" y="616" class="line">Do not run deployed Verify</text><rect x="465" y="490" width="350" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="487" y="526" class="bt">6  Foundation destroy</text><text x="487" y="562" class="line">Run from operator workstation</text><text x="487" y="589" class="line">Exact lab confirmation</text><text x="487" y="616" class="line">Preserve recovery state</text><rect x="880" y="490" width="350" height="170" rx="12" fill="#12314b" stroke="#36566e" stroke-width="1.5"/><text x="902" y="526" class="bt">7  Residual verification</text><text x="902" y="562" class="line">Exact resource IDs / groups</text><text x="902" y="589" class="line">Record retained records</text><text x="902" y="616" class="line">Review cost later</text><path d="M400 575 H454" class="edge"/><path d="M815 575 H869" class="edge"/><text x="50" y="750" class="small">Never remove the backend to bypass workload cleanup. External host/connectivity remain outside lab ownership.</text></svg>